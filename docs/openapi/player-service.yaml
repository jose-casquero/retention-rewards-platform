openapi: 3.0.3
info:
  title: Player Service API
  version: 1.0.0
paths:
  /api/v1/players:
    post:
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '200':
          description: Player created
  /api/v1/players/{id}:
    get:
      summary: Get a player
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Player found }
        '404': { description: Player not found }
  /api/v1/players/{id}/activity:
    post:
      summary: Record player activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Activity accepted }
components:
  schemas:
    CreatePlayerRequest:
      type: object
      required: [email, country, preferredChannel]
      properties:
        email: { type: string, format: email }
        country: { type: string }
        preferredChannel: { type: string, enum: [PUSH, EMAIL, SMS] }
        marketingOptIn: { type: boolean }
